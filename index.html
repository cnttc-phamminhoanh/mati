<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Phạm Minh Oanh — Career DNA</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--pn:rgba(30,32,34,.6);--ln:rgba(255,255,255,.1);--tx:#eef5f2;--mu:#93a29c;--a:#c6f5e6;--b:#4adeb5;--c:#f07a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 45% at 82% 12%,rgba(16,185,129,.14),transparent 70%),radial-gradient(50% 45% at 6% 90%,rgba(240,122,138,.08),transparent 70%),radial-gradient(40% 30% at 45% 55%,rgba(177,255,229,.04),transparent)}
body{background:var(--bg);color:var(--tx);font:16px/1.65 Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Space Grotesk","Noto Sans SC",system-ui,sans-serif;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;transition:opacity .6s}
header,main,footer{position:relative;z-index:1}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 5vw 12px;background:rgba(10,11,13,.78);border-bottom:1px solid var(--ln)}
.logo{font:700 18px "Space Grotesk";letter-spacing:.5px}.logo i{color:var(--a);font-style:normal}
nav{display:flex;gap:22px;align-items:center}
nav a{color:var(--mu);text-decoration:none;font-size:14px;transition:.2s}nav a:hover{color:var(--a)}
.lang{display:flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden}
.lang button{padding:4px 11px;font-size:13px;color:var(--mu)}.lang button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#05070d;font-weight:500}
@media(max-width:820px){nav a{display:none}}
section{padding:110px 6vw}
.bgs{background:linear-gradient(180deg,rgba(10,11,13,.72),rgba(10,11,13,.9))}
.wrap{max-width:1050px;margin:auto}
h2{font-size:clamp(28px,4vw,42px);margin-bottom:34px}h2 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#hero{min-height:100vh;display:flex;align-items:center}
#hero .in{max-width:560px}
.hi{color:var(--a);letter-spacing:2px;font-size:14px;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(40px,7vw,76px);background:linear-gradient(90deg,#fff,var(--a) 60%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font:500 clamp(17px,2.2vw,22px) "Space Grotesk","Noto Sans SC";margin:14px 0 10px}
.tag{color:var(--mu);max-width:480px}
.btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:99px;text-decoration:none;font-weight:500;font-size:15px;transition:.25s}
.p{background:linear-gradient(90deg,var(--a),var(--b));color:#05070d}.p:hover{box-shadow:0 0 28px rgba(74,222,181,.35);transform:translateY(-2px)}
.g{border:1px solid var(--ln);color:var(--tx)}.g:hover{border-color:var(--a);color:var(--a)}
.scr{position:absolute;bottom:26px;left:6vw;color:var(--mu);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.scr:after{content:"";display:block;width:1px;height:34px;background:linear-gradient(var(--a),transparent);margin-top:8px;animation:dr 1.6s infinite}
@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#journey{height:430vh;padding:0;pointer-events:none}
.stick{position:sticky;top:0;height:100vh;padding:100px 6vw 26px;display:flex;flex-direction:column;justify-content:space-between}
.stick h2{margin-bottom:10px}.hint{color:var(--mu);max-width:340px;font-size:14px}
.cur{font:700 clamp(52px,9vw,110px) "Space Grotesk";line-height:1;color:rgba(255,255,255,.1);-webkit-text-stroke:1px rgba(177,255,229,.5)}
.curt{color:var(--tx);margin-top:6px;max-width:320px;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
.chip{padding:7px 15px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);font-size:13px;color:var(--mu);transition:.2s}
.chip.on,.chip:hover{border-color:var(--c);color:var(--c)}
#labels{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .4s}
#labels.on{opacity:1}
.lb{position:absolute;left:0;top:0;pointer-events:auto;padding:5px 12px;border-radius:8px;background:var(--pn);border:1px solid rgba(177,255,229,.5);color:var(--c);font:500 13px "Space Grotesk";backdrop-filter:blur(6px);white-space:nowrap}
.lb:hover{background:rgba(177,255,229,.16)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:24px;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:var(--a);box-shadow:0 12px 40px rgba(74,222,181,.12)}
.card b{font:700 38px "Space Grotesk";color:var(--a);display:block}
.card h3{font-size:19px;margin-bottom:6px}.card p{color:var(--mu);font-size:14px}
.tg{display:inline-block;padding:2px 10px;margin:8px 6px 0 0;border-radius:99px;border:1px solid var(--ln);font-size:12px;color:var(--mu)}
.sk{margin-bottom:18px}.sk div:first-child{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.in .bar i{width:var(--w)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:50px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.rv{opacity:0;transform:translateY(28px);transition:.8s}.rv.in{opacity:1;transform:none}
#contact{text-align:center}#contact p{color:var(--mu);max-width:520px;margin:0 auto 26px}
.soc{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
footer{padding:26px;text-align:center;color:var(--mu);font-size:13px;border-top:1px solid var(--ln);background:var(--bg)}
#panel{position:fixed;left:50%;top:50%;width:min(940px,94vw);max-height:86vh;z-index:30;border-radius:28px;padding:44px;overflow-y:auto;background:linear-gradient(145deg,rgba(36,34,38,.82),rgba(10,11,13,.92));box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.14);opacity:0;pointer-events:none;transform:translate(-50%,-44%) scale(.94);will-change:transform,opacity;transition:opacity .5s,transform .7s cubic-bezier(.2,.9,.2,1)}
#panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#x{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:20px;width:38px;height:38px;border:1px solid var(--ln);border-radius:50%;font-size:20px}#x:hover{border-color:var(--a);color:var(--a)}
#panel .yr{font:700 54px "Space Grotesk";color:var(--c);line-height:1}
#panel h3{font-size:24px;margin:8px 0 2px}.org{color:var(--a);font-size:14px;margin-bottom:12px}
#panel h4{margin:24px 0 8px;font:500 12px "Space Grotesk";letter-spacing:2px;text-transform:uppercase;color:var(--mu)}
#panel li{margin:0 0 7px 18px;font-size:15px}#panel li::marker{color:var(--a)}
.pj{padding:14px;border:1px solid var(--ln);border-radius:12px;margin-bottom:10px;background:rgba(255,255,255,.02)}.pj b{font-family:"Space Grotesk"}.pj p{color:var(--mu);font-size:14px}
#bd{position:fixed;inset:0;z-index:29;background:radial-gradient(circle,rgba(10,11,13,.15),rgba(10,11,13,.8));opacity:0;pointer-events:none;transition:opacity .5s}#bd.on{opacity:1;pointer-events:auto}
#bg{transition:opacity .6s,filter .9s}#bg.dim{opacity:.4!important}
.dh{display:grid;grid-template-columns:1fr 1.15fr;gap:44px}
@media(max-width:820px){.dh{grid-template-columns:1fr;gap:18px}#panel{padding:30px 20px}}
#panel .yr{font:700 clamp(64px,10vw,120px) 'Space Grotesk';line-height:.9;letter-spacing:-3px;background:linear-gradient(135deg,var(--a),var(--b) 55%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
#panel h3{font-size:clamp(22px,3vw,32px);margin:14px 0 4px}
.ds{color:var(--mu);margin-top:14px}
.st{list-style:none}#panel .st li{margin:0 0 10px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--ln);display:flex;gap:14px;align-items:baseline;font-size:15px}
.st span{font:500 12px 'Space Grotesk';color:var(--a)}
.pjs{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.pjs{grid-template-columns:1fr}}
.pj{transition:.3s}.pj:hover{transform:translateY(-4px);border-color:var(--b)}
.nv{display:flex;align-items:center;gap:14px;margin-top:26px;color:var(--mu);font-size:13px}.nv button{width:42px;height:42px;border:1px solid var(--ln);border-radius:50%}.nv button:hover{border-color:var(--c);color:var(--c)}
.s{opacity:0}.open .s{animation:up .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.07s + .15s)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.lb{background:none;border:0;border-bottom:1px solid rgba(255,255,255,.35);border-radius:0;padding:2px;font:500 11px 'Space Grotesk',sans-serif;letter-spacing:2px;text-transform:uppercase;color:#fff;backdrop-filter:none}
